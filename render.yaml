services:
  - type: web
    name: app-scholar-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DB_FILE
        value: ./data/app_scholar.sqlite
      - key: JWT_SECRET
        generateValue: true
